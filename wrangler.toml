name = "mcxi-play"
main = "worker/src/index.ts"
compatibility_date = "2024-12-01"

[assets]
directory = "dist"
binding = "ASSETS"
# SPA deep links (/regalo/..., /pedido/..., /admin) serve index.html; /api/* always hits the Worker.
# /export-kit/* (paid engine) also goes to the Worker, which blocks direct access (404).
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/export-kit/*"]

[[d1_databases]]
binding = "DB"
database_name = "mcxi-play-db"
database_id = "72d7b25c-7907-49fd-b4c4-86c87768115a"
migrations_dir = "worker/migrations"
