name = "mcxi-play"
main = "worker/src/index.ts"
compatibility_date = "2024-12-01"

[assets]
directory = "dist"
# SPA deep links (/regalo/..., /pedido/..., /admin) serve index.html; /api/* always hits the Worker
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mcxi-play-db"
database_id = "" # Set after running: npx wrangler d1 create mcxi-play-db
migrations_dir = "worker/migrations"
